[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-s3-voice-companion"
version = "0.1.0"
description = "Local FunASR voice captions for an ESP32-S3 OLED and WeChat mini program"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.121.0", "uvicorn==0.38.0", "websockets==15.0.1",
  "numpy==1.26.4", "funasr-onnx==0.4.8", "onnxruntime==1.23.2",
  "librosa==0.11.0", "scipy==1.15.3",
  "psutil==7.1.3", "qrcode==8.2", "pypng==0.20220715.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[project.scripts]
voice-companion = "voice_companion.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
