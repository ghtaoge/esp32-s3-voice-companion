name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-and-miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight contract-test dependencies
        run: |
          python -m pip install -c requirements.lock.txt fastapi==0.121.0 uvicorn==0.38.0 websockets==15.0.1 numpy==1.26.4 psutil==7.1.3 pytest==8.4.2 httpx==0.28.1 qrcode==8.2 pypng==0.20220715.0
          python -m pip install --no-deps -e .
      - run: python tools/check_public.py
      - run: python -m pytest -q
      - run: npm test --prefix miniprogram
      - name: Native firmware logic
        run: |
          g++ -std=c++17 -Ifirmware/include firmware/tests/native.cpp -o /tmp/voice-native
          /tmp/voice-native
